<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">zlrd</title>
  <desc id="desc">Two log lines with a terminal prompt between healthy and crash states.</desc>

  <defs>
    <linearGradient id="incident" x1="210" y1="190" x2="210" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB454"/>
      <stop offset="1" stop-color="#FF5266"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="#10141D"/>

  <!-- Log records frame the terminal prompt that reads between them. -->
  <path d="M100 124H412" fill="none" stroke="#E9F1F4" stroke-width="34" stroke-linecap="round"/>
  <path d="m164 197 84 59-84 59" fill="none" stroke="url(#incident)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M288 317h78" stroke="url(#incident)" stroke-width="28" stroke-linecap="round"/>
  <path d="M100 388H412" fill="none" stroke="#E9F1F4" stroke-width="34" stroke-linecap="round"/>

  <!-- Status dots turn the mark into a tiny log timeline. -->
  <circle cx="100" cy="124" r="10" fill="#4ADEA0"/>
  <circle cx="412" cy="388" r="10" fill="#FF5266"/>
</svg>
