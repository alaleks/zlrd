name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            os: ubuntu-latest
            ext: tar.gz
            platform: x86_64-linux

          - target: x86_64-windows-gnu
            os: ubuntu-latest
            ext: zip
            platform: x86_64-windows

          - target: x86_64-macos
            os: macos-latest
            ext: tar.gz
            platform: x86_64-macos

          - target: aarch64-macos
            os: macos-latest
            ext: tar.gz
            platform: aarch64-macos

    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Build
        run: |
          zig build \
            -Doptimize=ReleaseFast \
            -Dtarget=${{ matrix.target }} \
            -Dversion="${{ github.ref_name }}"

      # Two artifacts per platform: the full `zlrd` binary and the reader-only
      # `zlrd-lite`. Named consistently so the release / homebrew / apt jobs
      # can locate them by predictable pattern.
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          plat="${{ matrix.platform }}"
          ext="${{ matrix.ext }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp zig-out/bin/zlrd.exe      dist/zlrd.exe
            cp zig-out/bin/zlrd-lite.exe dist/zlrd-lite.exe
            (cd dist && zip "zlrd-${plat}.${ext}"      zlrd.exe)
            (cd dist && zip "zlrd-lite-${plat}.${ext}" zlrd-lite.exe)
            rm dist/zlrd.exe dist/zlrd-lite.exe
          else
            cp zig-out/bin/zlrd      dist/zlrd
            cp zig-out/bin/zlrd-lite dist/zlrd-lite
            (cd dist && tar czf "zlrd-${plat}.${ext}"      zlrd)
            (cd dist && tar czf "zlrd-lite-${plat}.${ext}" zlrd-lite)
            rm dist/zlrd dist/zlrd-lite
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build .deb packages
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"

          build_deb() {
            local pkg_name="$1"     # zlrd | zlrd-lite
            local bin_name="$2"     # zlrd | zlrd-lite
            local archive="$3"      # dist/<archive>.tar.gz
            local desc_short="$4"
            local desc_long="$5"

            local work="pkg-${pkg_name}"
            rm -rf "${work}"
            mkdir -p "${work}/DEBIAN" "${work}/usr/local/bin"

            local extract="extract-${pkg_name}"
            rm -rf "${extract}"
            mkdir -p "${extract}"
            tar xzf "${archive}" -C "${extract}"
            cp "${extract}/${bin_name}" "${work}/usr/local/bin/${bin_name}"
            chmod 755 "${work}/usr/local/bin/${bin_name}"

            {
              echo "Package: ${pkg_name}"
              echo "Version: ${VER}"
              echo "Architecture: amd64"
              echo "Maintainer: alaleks <alaleksandrov30@gmail.com>"
              echo "Section: utils"
              echo "Priority: optional"
              echo "Homepage: https://github.com/alaleks/zlrd"
              echo "Description: ${desc_short}"
              echo " ${desc_long}"
            } > "${work}/DEBIAN/control"

            dpkg-deb --build "${work}" "dist/${pkg_name}_${VER}_amd64.deb"
          }

          build_deb \
            "zlrd" "zlrd" "dist/zlrd-x86_64-linux.tar.gz" \
            "Fast log viewer CLI (full: reader + agent + sidecar)" \
            "High-performance log reader, filter, tailer, and observability agent."

          build_deb \
            "zlrd-lite" "zlrd-lite" "dist/zlrd-lite-x86_64-linux.tar.gz" \
            "Fast log viewer CLI (reader-only lightweight build)" \
            "Reader-only build of zlrd: filter, tail, colorize. No agent, no metrics."

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip *.deb > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    # Skip pre-releases (v1.0.0-beta, v1.0.0-rc1, etc.)
    if: ${{ !contains(github.ref_name, '-') }}
    # Don't fail the release if the tap update fails (e.g. token not configured yet)
    continue-on-error: true
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "bundle-*-macos"

      - name: Update formulae
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN not configured — skipping Homebrew tap update"
            exit 0
          fi

          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          BASE="https://github.com/alaleks/zlrd/releases/download/${VERSION}"

          SHA_FULL_ARM=$(sha256sum dist/zlrd-aarch64-macos.tar.gz      | awk '{print $1}')
          SHA_FULL_X86=$(sha256sum dist/zlrd-x86_64-macos.tar.gz       | awk '{print $1}')
          SHA_LITE_ARM=$(sha256sum dist/zlrd-lite-aarch64-macos.tar.gz | awk '{print $1}')
          SHA_LITE_X86=$(sha256sum dist/zlrd-lite-x86_64-macos.tar.gz  | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/alaleks/homebrew-tap.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/zlrd.rb << EOF
          class Zlrd < Formula
            desc "Fast log viewer: tail/grep alternative with filtering and coloring"
            homepage "https://github.com/alaleks/zlrd"
            version "${VER}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/zlrd-aarch64-macos.tar.gz"
                sha256 "${SHA_FULL_ARM}"
              end
              on_intel do
                url "${BASE}/zlrd-x86_64-macos.tar.gz"
                sha256 "${SHA_FULL_X86}"
              end
            end

            def install
              bin.install "zlrd"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/zlrd --version")
            end
          end
          EOF

          cat > tap/Formula/zlrd-lite.rb << EOF
          class ZlrdLite < Formula
            desc "Fast log viewer (reader-only, lightweight build)"
            homepage "https://github.com/alaleks/zlrd"
            version "${VER}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/zlrd-lite-aarch64-macos.tar.gz"
                sha256 "${SHA_LITE_ARM}"
              end
              on_intel do
                url "${BASE}/zlrd-lite-x86_64-macos.tar.gz"
                sha256 "${SHA_LITE_X86}"
              end
            end

            def install
              bin.install "zlrd-lite"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/zlrd-lite --version")
            end
          end
          EOF

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zlrd.rb Formula/zlrd-lite.rb
          git diff --staged --quiet || git commit -m "chore: bump zlrd + zlrd-lite to ${VERSION}"
          git push

  publish-apt:
    name: Publish apt packages (Buildkite Package Registries)
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    continue-on-error: true
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundle-x86_64-linux
          path: incoming

      - name: Build .debs
        run: |
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"

          build_deb() {
            local pkg_name="$1"
            local bin_name="$2"
            local archive="$3"
            local desc_short="$4"
            local desc_long="$5"

            local work="pkg-${pkg_name}"
            rm -rf "${work}"
            mkdir -p "${work}/DEBIAN" "${work}/usr/local/bin"

            local extract="extract-${pkg_name}"
            rm -rf "${extract}"
            mkdir -p "${extract}"
            tar xzf "${archive}" -C "${extract}"
            cp "${extract}/${bin_name}" "${work}/usr/local/bin/${bin_name}"
            chmod 755 "${work}/usr/local/bin/${bin_name}"

            {
              echo "Package: ${pkg_name}"
              echo "Version: ${VER}"
              echo "Architecture: amd64"
              echo "Maintainer: alaleks <alaleksandrov30@gmail.com>"
              echo "Section: utils"
              echo "Priority: optional"
              echo "Homepage: https://github.com/alaleks/zlrd"
              echo "Description: ${desc_short}"
              echo " ${desc_long}"
            } > "${work}/DEBIAN/control"

            dpkg-deb --build "${work}" "${pkg_name}_${VER}_amd64.deb"
          }

          build_deb \
            "zlrd" "zlrd" "incoming/zlrd-x86_64-linux.tar.gz" \
            "Fast log viewer CLI (full: reader + agent + sidecar)" \
            "High-performance log reader, filter, tailer, and observability agent."

          build_deb \
            "zlrd-lite" "zlrd-lite" "incoming/zlrd-lite-x86_64-linux.tar.gz" \
            "Fast log viewer CLI (reader-only lightweight build)" \
            "Reader-only build of zlrd: filter, tail, colorize. No agent, no metrics."

          echo "DEB_FULL=zlrd_${VER}_amd64.deb"      >> "$GITHUB_ENV"
          echo "DEB_LITE=zlrd-lite_${VER}_amd64.deb" >> "$GITHUB_ENV"

      - name: Push to Buildkite Package Registries
        env:
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
        run: |
          if [ -z "${PACKAGECLOUD_TOKEN}" ]; then
            echo "PACKAGECLOUD_TOKEN not configured — skipping apt publish"
            exit 0
          fi

          # Buildkite Package Registries API:
          #   POST https://api.buildkite.com/v2/packages/organizations/<org>/registries/<registry>/packages
          # Bearer token must be a Buildkite API Access Token with the
          # "write_packages" REST API scope.
          push_deb() {
            local file="$1"
            local http_code
            http_code=$(curl -sS -o "response-${file}.txt" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${PACKAGECLOUD_TOKEN}" \
              -F "file=@${file}" \
              "https://api.buildkite.com/v2/packages/organizations/aleksandr-aleksandrov/registries/zlrd/packages")

            echo "→ ${file}: HTTP ${http_code}"
            cat "response-${file}.txt"
            echo

            if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
              return 1
            fi
          }

          push_deb "${DEB_FULL}"
          push_deb "${DEB_LITE}"
